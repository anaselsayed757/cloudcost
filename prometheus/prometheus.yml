global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'main-server'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'main-server'
          vm_name: 'Vm-Project-Main'

  - job_name: 'vm-targets'
    static_configs:
      - targets:
          - '10.150.40.20:9100'
          - '10.150.40.21:9100'
          - '10.150.40.22:9100'
        labels:
          job: 'vm-targets'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
